name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"            # Mondays: also run the tests that need models and the internet
  workflow_dispatch:

permissions:
  contents: read

concurrency:                        # a new PR push replaces the old run; main keeps every run
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.12"                 # pjsua2 wheels exist only for 3.12

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --locked ruff check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra speech
      - run: uv run pytest

  sip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra speech --extra sip
      - run: uv run python -c "import pjsua2"   # fail here instead of skipping every SIP test
      - run: uv run pytest -m "sip and not network"

  external:
    # Real speech models (about 150 MB download) and sip.linphone.org: weekly and on demand only,
    # so an outage on their side never blocks a push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra speech --extra sip
      - run: uv run python -c "import pjsua2"
      - run: uv run pytest -m "slow or network"
